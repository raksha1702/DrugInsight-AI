version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: druginsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: druginsight
      POSTGRES_PASSWORD: druginsight_secure_pass_2026
      POSTGRES_DB: druginsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druginsight -d druginsight_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: druginsight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: druginsight-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://druginsight:druginsight_secure_pass_2026@db:5432/druginsight_db
      - SYNC_DATABASE_URL=postgresql://druginsight:druginsight_secure_pass_2026@db:5432/druginsight_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=druginsight-super-secret-production-key-change-in-env-2026
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    volumes:
      - artifacts_data:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
